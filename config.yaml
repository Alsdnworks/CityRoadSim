# =========================================================
# City Simulation 설정
# GUI에서는 이 YAML의 각 항목을 위젯과 1:1 매핑할 수 있다.
# =========================================================
simulation:
  grid_size: 16
  block_size: 32.0
  center: 2.5
  seed: 67

intersection:
  type_values: [1, 2, 3]
  type_weights: [0.33, 0.33, 0.34]
  rotations: [0, 90, 180, 270]
  rotatable_types: [2, 3]
  area_bounds: [1.0, 1.0, 4.0, 4.0]

transition:
  near_offset: 1.0
  bend_offset: 2.0

# 블록 내부 이면도로: n×n grid 샘플 위치에서 축 정렬 양방향 단선을 생성
internal_road:
  enabled: true
  block_probability: 1.0
  min_count_per_block: 2
  max_count_per_block: 5

  # 한 Block 내부의 샘플 column/row 수. n이면 n개 X column + n개 Y row 후보를 만든다.
  sampling_grid_size: 5

  # S↔N 수직선 / W↔E 수평선 선택 가중치. diagonal은 생성하지 않는다.
  vertical_weight: 0.5
  horizontal_weight: 0.5
  transition_endpoint_clearance: 2
  min_length: 5.0
  max_attempts: 50

topology:
  tolerance: 1.0e-8
  coordinate_precision: 9

output:
  gpkg: ./output/city_sim.gpkg
  links_layer: links
  nodes_layer: nodes
  overwrite: true

visualization:
  enabled: false
  show_window: false
  show_node_id: false
  figure_size: [14, 14]
  axis_padding_min: 1.0
  axis_padding_max: 6.0
  grid: true
  intersection_colors:
    1: blue
    2: green
    3: red
  transition_color: black
  internal_road_color: dimgray
  node_color: black
  intersection_linewidth: 2.5
  transition_linewidth: 1.8
  internal_road_linewidth: 1.2
  node_size: 30
  node_label_offset: 0.08
  node_label_fontsize: 6
  intersection_label_fontsize: 7
